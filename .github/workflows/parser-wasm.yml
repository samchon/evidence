name: parser-wasm

on:
  pull_request:
    paths:
      - scripts/parser-builds.json
      - scripts/build-parser-wasm.js
      - scripts/publish-parser-wasm.js
      - .github/workflows/parser-wasm.yml
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      grammar:
        description: Recipe identifier from scripts/parser-builds.json
        default: matlab
        required: true
        type: string
      publish:
        description: Publish a new immutable-by-digest parser release from master
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - name: Build twice and verify real parsing
        id: grammar
        env:
          GRAMMAR_ID: ${{ inputs.grammar || 'matlab' }}
        run: node scripts/build-parser-wasm.js "$GRAMMAR_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-parser
          path: ${{ steps.grammar.outputs.directory }}
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-parser
          path: test/.tmp/verified-parser
      - name: Publish without replacement and verify acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-parser-wasm.js test/.tmp/verified-parser
