name: test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile
      - name: Cache ttsc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-evid-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - name: Cache pinned parser fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/.tmp/parser-fixtures
          key: evid-parsers-${{ runner.os }}-${{ hashFiles('packages/evid/src/internal/parser-grammars.json') }}
      - name: Run logic unit tests
        run: pnpm test
